name: Generate and publish release notes

on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example, v4.19.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'create' &&
        github.event.ref_type == 'tag' &&
        startsWith(github.event.ref, 'v'))
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.ref }}

      - name: Select release tag and previous tag
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          CREATED_TAG: ${{ github.event.ref }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-$CREATED_TAG}"
          previous_tag="$(git tag --sort=-version:refname | awk -v tag="$tag" '$0 != tag { print; exit }')"

          if [ -z "$previous_tag" ]; then
            echo "No previous release tag was found for $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Install GitHub Copilot CLI
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Use Copilot to generate release notes
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PREV_TAG: ${{ steps.tags.outputs.previous_tag }}
          RELEASE_TAG: ${{ steps.tags.outputs.tag }}
        run: |
          copilot \
            --allow-all-tools \
            --prompt \
            "Using the instructions in @.github/release-notes-instructions.md, and the changes between $PREV_TAG and $RELEASE_TAG, can you write a release note in release-notes.md"

      - name: Upload release notes for review
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.tags.outputs.tag }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Display Release Notes
        run: |
          echo "--- Copilot Generated Notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        if: github.event_name == 'create'
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN_4_WORKFLOW_FROM_WORKFLOW }}
          RELEASE_TAG: ${{ steps.tags.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md