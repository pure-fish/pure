name: Generate and publish release notes

on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example, v4.19.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'create' &&
        github.event.ref_type == 'tag' &&
        startsWith(github.event.ref, 'v'))
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.ref }}

      - name: Select release tag and previous tag
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          CREATED_TAG: ${{ github.event.ref }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-$CREATED_TAG}"
          previous_tag="$(git tag --sort=-version:refname | awk -v tag="$tag" '$0 != tag { print; exit }')"

          if [ -z "$previous_tag" ]; then
            echo "No previous release tag was found for $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Install GitHub Copilot CLI
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Use Copilot to generate release notes
        id: copilot-notes
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PREV_TAG: ${{ steps.tags.outputs.previous_tag }}
          LAST_TAG: ${{ steps.tags.outputs.tag }}
        run: |
          NOTES=$(\
            copilot \
              --allow-all-tools \
              --prompt \
            "Can you generate a release notes draft, using the instructions in @.github/release-notes-instructions.md, for the changes between $PREV_TAG and $LAST_TAG ?"\
          )

          # Store output for subsequent steps
          echo "release-notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Display Release Notes
        run: |
          echo "--- Copilot Generated Notes ---"
          echo "${{ steps.copilot-notes.outputs.release-notes }}"

