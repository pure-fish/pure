name: Add version tag

on:
  push:
    branches:
      - master
    paths:
      - conf.d/pure.fish
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Expected commit SHA (leave empty for manual tagging)'
        required: false
        type: string

permissions:
  actions: write
  contents: write

jobs:
  add-version-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Verify bump commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "Master moved since the version bump; refusing to tag." >&2
            exit 1
          fi

      - uses: butlerlogic/action-autotag@1.1.2 # 1.1.4 is buggy https://github.com/ButlerLogic/action-autotag/issues/49
        id: tag
        with:
          root: "./conf.d/pure.fish"
          regex_pattern: "pure_version\\s(?<version>(\\d+(\\.)?){3})"
          tag_prefix: "v"
        env:
          GITHUB_TOKEN: "${{ github.token }}"

      - name: Start release notes
        if: steps.tag.outputs.tagcreated == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tagname }}
        run: |
          gh workflow run release-notes.yml \
            --ref "$GITHUB_REF_NAME" -f tag="$TAG" -f publish=true
