name: Test on NixOS

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false

jobs:
  test-nixos:
    name: Test `pure` with Fish ${{ matrix.version.fish }} on NixOS container
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [
            { fish: "latest" }, # https://search.nixos.org/packages?show=fish&type=packages&query=fish
          ]
    env:
      NIX_VERSION: "2.35.2"

    steps:        
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug with tmate (SSH Access)
        uses: mxschmitt/action-tmate@v3
        if: failure() || inputs.debug_enabled == true
        with:
          detached: true
        timeout-minutes: ${{ vars.TMATE_TIMEOUT && fromJSON(vars.TMATE_TIMEOUT) || 5 }}
        continue-on-error: true

      - name: Build Pure Image on NixOS
        run: make build-pure-on-nix NIX_VERSION=$NIX_VERSION # use code from local context, see fish-with-pure.nix

      - name: Run Tests
        run: make test-pure-on-nix NIX_VERSION=$NIX_VERSION
