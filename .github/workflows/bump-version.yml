name: Bump version # only when test

on:
  workflow_call:
    secrets:
      CI_TOKEN_4_WORKFLOW_FROM_WORKFLOW:
        description: "A token passed from the caller workflow so git push can trigger workflows"
        required: true
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          token: ${{ secrets.CI_TOKEN_4_WORKFLOW_FROM_WORKFLOW }}
          # When you see:
          #   Error: fatal: could not read Username for 'https://github.com': terminal prompts disabled
          # visit https://github.com/settings/personal-access-tokens/new

      - name: Get next version
        id: next_version
        uses: thenativeweb/get-next-version@main

      - name: Show the next version
        run: |
          echo ${{ steps.next_version.outputs.version }}
          echo ${{ steps.next_version.outputs.hasNextVersion }}

      - name: Bump version file
        if: steps.next_version.outputs.hasNextVersion == 'true'
        run: |
          perl -i -p -e \
            "s/(pure_version)\s(\d+(\.)?){3}([^\s]+)?/\1 ${{ steps.next_version.outputs.version }}/" \
            ./conf.d/pure.fish

      - name: Set git user metadata
        if: steps.next_version.outputs.hasNextVersion == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Commit new version file
        if: steps.next_version.outputs.hasNextVersion == 'true'
        run: |
          git add --verbose ./conf.d/pure.fish \
          && git commit --allow-empty --message "chore: bump version ${{ steps.next_version.outputs.version }}"

      - name: Push bump commit # this commit once pushed will trigger the add-version-tag workflow
        if: steps.next_version.outputs.hasNextVersion == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.CI_TOKEN_4_WORKFLOW_FROM_WORKFLOW }}
