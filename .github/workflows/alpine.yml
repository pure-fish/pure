name: Test on Alpine

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false

jobs:
  test-container:
    name: Test `pure` with Fish ${{ matrix.version.fish }} on Alpine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [
            { fish: 3.6.1, alpine: 3.18   }, # for Debian 12 = 3.6.0, but no binary before 4.x
            { fish: 3.7.1, alpine: 3.21   }, # for Entreprise Linux 10, for Ubuntu 24.04 LTS = 3.7.0, but no binary before 4.x
            { fish: 4.0.2, alpine: 3.22   }, # for Debian 13, Fedora 43
            { fish: 4.2.0, alpine: "edge" }, # for Entreprise Linux 10
            { fish: 4.2.1, alpine: "edge" }, # for Ubuntu 26.04 LTS 
            { fish: 4.6.0, alpine: 3.24   }, # for Fedora 44
            { fish: 4.9.3, alpine: "edge" }, # for Latest Fish release
            # { fish: 9.9.9, alpine: 'edge' },
          ]
    steps:
      - run: docker --version

      - uses: actions/checkout@v4

      - name: Debug
        run: echo  ${{ vars.TMATE_TIMEOUT && fromJSON(vars.TMATE_TIMEOUT) || 5 }}

      - name: Debug with tmate (SSH Access)
        uses: mxschmitt/action-tmate@v3
        if: failure() || inputs.debug_enabled == true
        with:
          detached: true
        timeout-minutes: ${{ vars.TMATE_TIMEOUT && fromJSON(vars.TMATE_TIMEOUT) || 5 }}
        continue-on-error: true

      - name: Build Pure Image on Alpine ${{ matrix.version.alpine }}
        run: make build-pure-on FISH_VERSION=${{ matrix.version.fish }}

      - name: Run Tests
        run: make test-pure-on FISH_VERSION=${{ matrix.version.fish }}
